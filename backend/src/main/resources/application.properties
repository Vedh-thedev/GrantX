server.port=8080

# ============================================================
# DATABASE — Update password below if yours differs from root/root
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/grantx_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&sessionVariables=sql_mode='STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION'
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — auto-creates/updates tables from entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=grantx-secret-key-2024-aiht-csbs-g11-vedpuri-vinith-vinitha-santosh-yuvaraj-very-long-secret-key
jwt.expiration=86400000

# Logging
logging.level.com.grantx=INFO
logging.level.org.springframework.security=WARN

# Disable schema.sql — Hibernate manages schema via ddl-auto
spring.sql.init.mode=never

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
